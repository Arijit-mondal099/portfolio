name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs for the same branch / PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Let Corepack download the pinned pnpm without an interactive prompt.
env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Placeholders only — src/lib/env.ts validates these at import time, so
      # the build needs valid-shaped values even though CI never sends mail.
      - name: Build
        run: pnpm build
        env:
          SMTP_HOST: smtp.example.com
          SMTP_PORT: "587"
          SMTP_USER: ci@example.com
          SMTP_PASS: ci-placeholder-password
          SMTP_FROM: CI <ci@example.com>
          CONTACT_TO_EMAIL: ci@example.com
          NEXT_PUBLIC_SITE_URL: https://example.com
          INNGEST_DEV: "1"

  commitlint:
    name: Commit messages
    # Validate the PR's commits against Conventional Commits (commit-msg hook parity).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
